[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microbekg-bench"
version = "3.0.0"
description = "Licence-aware loaders and filtered rank evaluator for MicrobeKG-Bench"
requires-python = ">=3.12"
dependencies = ["numpy>=2.3,<3", "pandas>=2.2", "scipy>=1.14", "pyarrow>=16"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["microbekg_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
